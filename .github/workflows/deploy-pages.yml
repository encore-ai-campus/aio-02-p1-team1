name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/api
          db_html=$(find docs -maxdepth 1 -name '*DB*.html' | head -n 1)
          api_html=$(find docs -maxdepth 1 -name '*API*.html' | head -n 1)
          if [ -z "$db_html" ]; then
            echo "DB definition HTML not found under docs/"
            exit 1
          fi
          if [ -z "$api_html" ]; then
            echo "API specification HTML not found under docs/"
            exit 1
          fi
          cp "$db_html" _site/index.html
          cp "$api_html" _site/api/index.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
